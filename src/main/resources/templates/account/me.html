<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My page</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>

<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>
<main class="container py-4">
    <h1 class="h3 mb-3">My page</h1>
    <p>You are logged in as <strong th:text="${username}">username</strong>.</p>
    <p class="text-secondary">Your own sets and parts will appear here once you link a Rebrickable account.</p>

    <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-primary" th:href="@{/}">Front page</a>
        <a class="btn btn-primary" th:href="@{/catalog/sets}">Browse sets</a>
        <a class="btn btn-primary" th:if="${isAdmin}" th:href="@{/admin/sync}">Sync Catalog</a>
        <!-- Logging out changes something, so it is a POST with a CSRF token, not a link -->
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="btn btn-outline-secondary">Log out</button>
        </form>
    </div>
</main>
</body>

</html>
