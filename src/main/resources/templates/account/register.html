<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
<main class="container py-4" style="max-width: 28rem;">
    <h1 class="h3 mb-3">Register</h1>
    <p class="text-secondary">You do not need a Rebrickable account.</p>

    <!-- novalidate: the server decides, so its messages are the ones the user sees -->
    <form method="post" th:action="@{/register}" th:object="${form}" novalidate>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" maxlength="40"
                   autocomplete="username" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
            <div class="invalid-feedback" th:each="message : ${#fields.errors('username')}" th:text="${message}">
                Error
            </div>
            <div class="form-text">3 to 40 characters: letters, digits, dot, dash and underscore.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" maxlength="72"
                   autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback" th:each="message : ${#fields.errors('password')}" th:text="${message}">
                Error
            </div>
            <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Password again</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                   maxlength="72" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:each="message : ${#fields.errors('confirmPassword')}"
                 th:text="${message}">Error
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
    </form>

    <p class="mt-4 mb-0">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>
</body>

</html>
