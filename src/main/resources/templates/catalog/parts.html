<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEGO parts</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>

<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>
<main class="container py-4">
    <h1 class="h3 mb-3">LEGO parts</h1>

    <!-- A plain GET form: works without JavaScript and the result has a URL that can be shared -->
    <form method="get" th:action="@{/catalog/parts}" class="row g-2 align-items-end mb-3">
        <div class="col-12 col-md-5">
            <label for="q" class="form-label">Name or part number</label>
            <input type="search" id="q" name="q" class="form-control" maxlength="100"
                   placeholder="e.g. brick 2 x 4 or 3001" th:value="${q}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/catalog/parts}"
               th:if="${q != null}">Clear</a>
        </div>
    </form>

    <p class="text-secondary" th:if="${!parts.isEmpty()}">
        Showing <span th:text="${firstRow}">1</span>–<span th:text="${lastRow}">24</span>
        of <span th:text="${parts.totalElements}">100</span> parts
    </p>

    <div class="alert alert-info" th:if="${parts.isEmpty()}">
        No parts match your search.
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6 g-3">
        <div class="col" th:each="part : ${parts.content}">
            <div class="card h-100" >
                <img th:if="${part.partImgUrl != null}" th:src="${part.partImgUrl}" th:alt="${part.name}"
                     class="card-img-top set-img" loading="lazy">
                <div th:if="${part.partImgUrl== null}"
                     class="set-img-missing d-flex align-items-center justify-content-center text-secondary small bg-light">
                    No picture
                </div>
                <div class="card-body">
                        <h2 class="h6 card-title mb-1">
                            <a class="stretched-link" th:href="${part.partUrl}" target="_blank" rel="noopener" th:text="${part.name}">
                                part name </a>
                        </h2>
                    <p class="card-text small text-secondary mb-1">
                        <span th:text="${part.partNum}">0000-1</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <nav class="d-flex justify-content-between align-items-center mt-4" aria-label="Pages"
         th:if="${parts.totalPages > 1}">
        <a class="btn btn-outline-primary" th:if="${prevUrl != null}" th:href="${prevUrl}" rel="prev">Previous</a>
        <span class="btn btn-outline-secondary disabled" th:if="${prevUrl == null}">Previous</span>
        <span>Page <span th:text="${currentPage}">1</span> of <span th:text="${parts.totalPages}">5</span></span>
        <a class="btn btn-outline-primary" th:if="${nextUrl != null}" th:href="${nextUrl}" rel="next">Next</a>
        <span class="btn btn-outline-secondary disabled" th:if="${nextUrl == null}">Next</span>
    </nav>

    <footer class="mt-5 small text-secondary">
        Catalog data and pictures from <a href="https://rebrickable.com">Rebrickable</a>.
    </footer>
</main>
</body>

</html>
