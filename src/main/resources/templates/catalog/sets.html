<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEGO sets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        .set-img {
            height: 9rem;
            object-fit: contain;
            padding: .5rem;
            background: #fff;
        }

        .set-img-missing {
            height: 9rem;
        }
    </style>
</head>

<body>
<main class="container py-4">
    <h1 class="h3 mb-3">LEGO sets</h1>

    <!-- A plain GET form: works without JavaScript and the result has a URL that can be shared -->
    <form method="get" th:action="@{/catalog/sets}" class="row g-2 align-items-end mb-3">
        <div class="col-12 col-md-5">
            <label for="q" class="form-label">Name or set number</label>
            <input type="search" id="q" name="q" class="form-control" maxlength="100"
                   placeholder="e.g. fire station or 60215" th:value="${q}">
        </div>
        <div class="col-12 col-md-4">
            <label for="theme" class="form-label">Theme</label>
            <select id="theme" name="theme" class="form-select">
                <option value="">All themes</option>
                <option th:each="option : ${themes}" th:value="${option.id}" th:text="${option.label}"
                        th:selected="${option.id == themeId}">Theme</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/catalog/sets}"
               th:if="${q != null or themeId != null}">Clear</a>
        </div>
    </form>

    <p class="text-secondary" th:if="${!sets.isEmpty()}">
        Showing <span th:text="${firstRow}">1</span>–<span th:text="${lastRow}">24</span>
        of <span th:text="${sets.totalElements}">100</span> sets
    </p>

    <div class="alert alert-info" th:if="${sets.isEmpty()}">
        No sets match your search.
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6 g-3">
        <div class="col" th:each="set : ${sets.content}">
            <div class="card h-100" >
                <img th:if="${set.imgUrl != null}" th:src="${set.imgUrl}" th:alt="${set.name}"
                     class="card-img-top set-img" loading="lazy">
                <div th:if="${set.imgUrl == null}"
                     class="set-img-missing d-flex align-items-center justify-content-center text-secondary small bg-light">
                    No picture
                </div>
                <div class="card-body">
                        <h2 class="h6 card-title mb-1">
                            <a class="stretched-link" th:href="@{/catalog/sets/{n}(n=${set.setNum})}" th:text="${set.name}">
                                Set name </a>
                        </h2>
                    <p class="card-text small text-secondary mb-1">
                        <span th:text="${set.setNum}">0000-1</span><span
                            th:if="${set.releaseYear != null}" th:text="${' · ' + set.releaseYear}"> · 2020</span>
                    </p>
                    <p class="card-text small mb-1" th:if="${set.themeName != null}" th:text="${set.themeName}">Theme</p>
                    <p class="card-text small text-secondary mb-0" th:if="${set.numParts != null}"
                       th:text="${set.numParts + ' parts'}">100 parts</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="d-flex justify-content-between align-items-center mt-4" aria-label="Pages"
         th:if="${sets.totalPages > 1}">
        <a class="btn btn-outline-primary" th:if="${prevUrl != null}" th:href="${prevUrl}" rel="prev">Previous</a>
        <span class="btn btn-outline-secondary disabled" th:if="${prevUrl == null}">Previous</span>
        <span>Page <span th:text="${currentPage}">1</span> of <span th:text="${sets.totalPages}">5</span></span>
        <a class="btn btn-outline-primary" th:if="${nextUrl != null}" th:href="${nextUrl}" rel="next">Next</a>
        <span class="btn btn-outline-secondary disabled" th:if="${nextUrl == null}">Next</span>
    </nav>

    <footer class="mt-5 small text-secondary">
        Catalog data and pictures from <a href="https://rebrickable.com">Rebrickable</a>.
    </footer>
</main>
</body>

</html>
