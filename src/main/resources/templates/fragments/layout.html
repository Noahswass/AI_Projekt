<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Pieces every page shares. A page pulls them in with th:replace, so the look is changed in one place. -->

<head>
  <!-- Stylesheets: Bootstrap first, then the Rubik font, then our own app.css (last, so it wins) -->
  <th:block th:fragment="assets">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
  </th:block>
</head>

<body>
<!-- The site header: a plate with studs on top. No login links here: the front page has those. -->
<header class="site-plate" th:fragment="siteHeader">
  <div class="container d-flex flex-wrap align-items-center gap-3 py-2">
    <a class="site-brand" th:href="@{/}">Brick catalog</a>
    <nav class="d-flex gap-3" aria-label="Catalog">
      <a th:href="@{/catalog/sets}">Sets</a>
      <a th:href="@{/catalog/parts}">Parts</a>
    </nav>
  </div>
</header>
</body>

</html>
