# Loads DB_URL, DB_USERNAME, DB_PASSWORD etc. from .env in the project root (gitignored).
# Without .env the app falls back to H2 in MySQL mode.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:AI_Projekt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.open-in-view=false
# Flyway owns the schema
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


server.error.include-stacktrace=never
server.error.include-message=always

# ADMIN ACCOUNT
app.admin.username=${ADMIN_USER:Admin}
app.admin.password=${ADMIN_PWD:}

# Rebrickable API
app.rebrickable.base-url=${REBRICKABLE_BASE_URL:https://rebrickable.com/api/v3}
app.rebrickable.api-key=${REBRICKABLE_API_KEY:}
app.rebrickable.timeout=10s
# Retries for 429 and 5xx: total attempts, and first wait (doubles each retry)
app.rebrickable.max-attempts=4
app.rebrickable.backoff=1s

# Daily sync: 02:00 hver dag
app.sync.cron=0 0 2 * * *
app.sync.zone=Europe/Copenhagen

# 32-byte nøgle, base64. Bruges til Rebrickable-tokens (Sprint 2)
app.security.encryption-key=${APP_ENCRYPTION_KEY:}

# LLM API
app.llm.base-url=${LLM_BASE_URL:https://api.anthropic.com}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:claude-haiku-5-5}
app.llm.max_tokens=${LLM_MAX_TOKENS:4000}
app.llm.effort=${LLM_EFFORT:low}
app.llm.timeout=30s
app.llm.max-attempts=2
app.llm.backoff=2s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

#IP-rate limits
app.rate-limit.max-non-user-questions=1
app.rate-limit.max-user-questions=3
app.rate-limit.refill-time=30s

